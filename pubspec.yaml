name: barber_application
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  persistent_bottom_nav_bar: ^6.2.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/jpg/
    - assets/icons/svg/

  fonts:
    - family: bold
      fonts:
        - asset: assets/font/dmsans/bold.ttf
    - family: medium
      fonts:
        - asset: assets/font/dmsans/medium.ttf
    - family: regular
      fonts:
        - asset: assets/font/dmsans/regular.ttf
